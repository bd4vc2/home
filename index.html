<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICEY // TACTICAL_OS v2.9.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-blue: #00f2ff;
            --aero-cyan: rgba(0, 242, 255, 0.15);
            --dark-void: #010812;
            --v-gold: #ffcc00;
            --hacker-green: #00ff99;
            --alert-red: #ff3366;
            --glass-bright: rgba(255, 255, 255, 0.1);
            --glass-dark: rgba(0, 10, 20, 0.85);
            --border-glow: rgba(0, 242, 255, 0.25);
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--dark-void);
            color: #c0d1d4;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            user-select: none;
        }

        /* TECH CRT SCANLINE EFFECT */
        body::before {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 21, 0.06));
            z-index: 999; background-size: 100% 3px, 6px 100%; pointer-events: none;
        }

        /* FALLBACK COLORS USED INSTEAD OF BREAKING IMAGE ASSOC */
        .aero-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0a1626 0%, var(--dark-void) 100%);
            z-index: -1;
        }

        /* LOADING OVERLAY */
        #boot-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
